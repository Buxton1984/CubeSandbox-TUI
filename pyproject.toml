[project]
name = "csbtui"
dynamic = ["version"]
description = "Tree-shaped control console for CubeSandbox - names, lineage and safe deletes for your MicroVM sandboxes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Buxton1984" }]
keywords = ["cubesandbox", "sandbox", "microvm", "cli", "tui", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
]
dependencies = ["cubesandbox>=0.7.3"]

[project.scripts]
csb = "csb:main"

[project.urls]
Homepage = "https://github.com/Buxton1984/CubeSandbox-TUI"
Documentation = "https://github.com/Buxton1984/CubeSandbox-TUI#readme"
Changelog = "https://github.com/Buxton1984/CubeSandbox-TUI/commits"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["csb", "csb_tui"]

[tool.setuptools.dynamic]
version = { attr = "csb.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "B006", "B008", "B011", "B015", "B018"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
